name: sim-nas

services:
  smb:
    build:
      context: ./smb
    image: sim-nas:latest
    container_name: sim-nas
    restart: unless-stopped
    ports:
      - "${SMB_PORT:-445}:445"
    environment:
      SMB_USER: "${SMB_USER:-nas}"
      SMB_SHARE: "${SMB_SHARE:-storage}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - "${HOST_STORAGE_PATH:-/mnt/nas}:/nas/storage"
      - "./state/samba:/var/lib/samba"
    secrets:
      - smb_password
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  smb_password:
    file: ./secrets/smb_password
